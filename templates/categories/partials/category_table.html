<div class="table-wrapper overflow-x-auto bg-white shadow-md rounded-lg">
    <table class="styled-table w-full border-collapse text-left">
        <thead class="bg-gray-100 border-b">
            <tr>
                <th class="p-3 text-gray-600 font-semibold">Nombre</th>
                <th class="p-3 text-gray-600 font-semibold">Descripción</th>
                <th class="p-3 text-gray-600 font-semibold text-center" colspan="2">Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for cat in categories %}
            <tr class="border-b hover:bg-gray-50 transition-colors">
                <td class="p-3 font-medium text-gray-800">{{ cat.name }}</td>
                <td class="p-3 text-gray-600">{{ cat.description|default:"Sin descripción" }}</td>
                <td class="p-3 text-center">
                    <a href="{% url 'category_update' cat.pk %}" 
                       hx-get="{% url 'category_update' cat.pk %}" 
                       hx-target="#main-dynamic-content"
                       hx-push-url="true"
                       class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1 rounded text-sm transition-colors inline-block">
                        Editar
                    </a>
                </td>
                <td class="p-3 text-center">
                    <button class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm transition-colors"
                            hx-post="{% url 'category_delete' cat.pk %}{% if page_obj.number %}?page={{ page_obj.number }}{% endif %}{% if search_query %}&q={{ search_query }}{% endif %}"
                            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                            hx-confirm="¿Estás seguro de eliminar la categoría '{{ cat.name }}'?"
                            hx-target="#category-table-container">
                        Eliminar
                    </button>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="text-center py-6 text-gray-500 italic">No se encontraron categorías registradas.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
