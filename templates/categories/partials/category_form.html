<div class="max-w-xl mx-auto bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
    <div class="flex justify-between items-center mb-6 pb-4 border-b">
        <h2 class="text-xl font-bold text-gray-800">{{ title }}</h2>
        <a href="{% url 'category_list' %}"
           class="text-sm text-gray-500 hover:text-gray-700"
           hx-get="{% url 'category_list' %}"
           hx-target="#main-dynamic-content"
           hx-push-url="true">
            Cancelar
        </a>
    </div>

    <form method="POST" 
          action="{{ action_url }}" 
          hx-post="{{ action_url }}" 
          hx-target="#main-dynamic-content"
          class="space-y-4">
        {% csrf_token %}

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre de la Categoría *</label>
            {{ form.name }}
            {% if form.name.errors %}
                <p class="text-xs text-red-500 mt-1">{{ form.name.errors.0 }}</p>
            {% endif %}
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
            {{ form.description }}
            {% if form.description.errors %}
                <p class="text-xs text-red-500 mt-1">{{ form.description.errors.0 }}</p>
            {% endif %}
        </div>

        <div class="flex justify-end space-x-3 pt-6 border-t mt-6">
            <a href="{% url 'category_list' %}"
               class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-semibold rounded-lg transition-colors"
               hx-get="{% url 'category_list' %}"
               hx-target="#main-dynamic-content"
               hx-push-url="true">
                Cancelar
            </a>
            <button type="submit" 
                    class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg shadow-sm transition-colors">
                Guardar Categoría
            </button>
        </div>
    </form>
</div>
