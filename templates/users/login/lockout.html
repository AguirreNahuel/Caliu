<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Bloqueado</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100">
    <div class="fixed inset-0 bg-slate-900 flex items-center justify-center p-4 z-50">
        <div class="max-w-md w-full p-8 bg-slate-800 border border-slate-700 rounded-lg shadow-lg text-center">
            <h1 class="text-2xl font-semibold mb-4 text-red-400">Acceso temporalmente bloqueado</h1>
            <p class="text-slate-300 text-sm mb-6">
                Se han detectado demasiados intentos fallidos de inicio de sesión desde esta red o dispositivo. Por seguridad, el acceso ha sido restringido temporalmente. Intente nuevamente más tarde.
            </p>
            <a href="/login/" class="inline-block bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium px-4 py-2 rounded transition-colors">
                Volver al inicio
            </a>
        </div>
    </div>
</body>
</html>
