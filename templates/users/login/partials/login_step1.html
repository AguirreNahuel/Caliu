<!-- templates/users/login/partials/login_step1.html -->
<form hx-post="{% url 'login' %}" 
      hx-ext="response-targets"
      hx-target="#login-container"
      hx-target-429="#rate-limit-error"
      class="space-y-4">
    
    <!-- Si pasas un error general por credenciales incorrectas desde Django -->
    {% if error %}
    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative text-sm">
        {{ error }}
    </div>
    {% endif %}

    <div>
        <label class="block text-gray-700 text-sm font-bold mb-2">Usuario o Email</label>
        <input type="text" name="identifier" required class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
        <label class="block text-gray-700 text-sm font-bold mb-2">Contraseña</label>
        <input type="password" name="password" required class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <button type="submit" name="verify_credentials" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition duration-200">
        Continuar
    </button>
</form>
